# Zoiko Payroll Platform — nginx site config (production GCE VM)
# ---------------------------------------------------------------------------
# Mirrors frontend/nginx.conf (the container's local-dev nginx), adapted for
# the real production topology: nginx on the VM serves the built frontend SPA
# from disk and reverse-proxies /api/* and /health to the systemd-managed
# backend on 127.0.0.1:8000.
#
# Install:
#   sudo cp deploy/nginx/zoiko-payroll.conf /etc/nginx/sites-available/zoiko-payroll
#   sudo ln -s /etc/nginx/sites-available/zoiko-payroll /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Change server_name to the real public domain, and enable HTTPS (Let's
# Encrypt / a load-balancer-terminated cert) in front of this server block.

server {
    listen 80;
    server_name _;

    root /var/www/zoiko-payroll/frontend/dist;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # static assets -- long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy -> backend (systemd: zoiko-payroll-backend)
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # health endpoint
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}