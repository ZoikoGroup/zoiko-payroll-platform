services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zoiko
      POSTGRES_PASSWORD: zoiko
      POSTGRES_DB: zoiko_payroll
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoiko -d zoiko_payroll"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend (FastAPI) ───────────────────────────────────────────────────
  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PAYROLL_DATABASE_URL: postgresql+psycopg://zoiko:zoiko@postgres:5432/zoiko_payroll
      # The postgres service above has no SSL configured — only Neon (the
      # production/dev default) requires it.
      PAYROLL_DB_SSL_MODE: disable
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend (nginx) ────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      target: frontend-serve
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
