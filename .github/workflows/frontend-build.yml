name: Build Zoiko Payroll Frontend

# The frontend build check for pull requests only: `build` proves the app
# compiles. Pushes to main/rugvedh are built AND deployed by backend-deploy.yml
# (`build`, then `deploy-frontend`), which ships the frontend only after the
# frontend build, the backend tests and privacy-isolation have passed for the
# same commit, and after the backend deploy when the backend changed too.
# (That deploy ships the built SPA to the production VM's nginx docroot; before
# it existed, nothing in version control copied frontend/dist to production,
# GCP_DEPLOYMENT.md §0.)
on:
  # No path filter, so the build check reports on every PR.
  pull_request:
    branches: [main, rugvedh]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      # vite build does not catch an undefined JSX component (it only throws
      # when the page renders) — that is how 9fc1a36 blanked production.
      - name: Refuse undefined names (no-undef / jsx-no-undef)
        working-directory: frontend
        run: npm run check:undefined
      - name: Build frontend
        working-directory: frontend
        run: npm run build

