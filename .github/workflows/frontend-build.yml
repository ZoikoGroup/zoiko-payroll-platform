name: Build Zoiko Payroll Frontend

# Separate from backend-deploy.yml deliberately: that workflow's `deploy`
# job SSHes in and restarts the live backend service, and it's scoped to
# backend/scripts paths only -- a frontend-only change should never
# trigger a backend restart.
#
# `build` runs on every push/PR and only proves the app compiles.
# `deploy` runs only for main (push or manual dispatch) and ships the built
# SPA to the production VM's nginx docroot. Before it existed, nothing in
# version control copied frontend/dist to production (GCP_DEPLOYMENT.md §0),
# so the live frontend silently fell weeks behind the auto-deployed backend.
on:
  push:
    branches: [main, rugvedh]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    branches: [main, rugvedh]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Never two frontend deploys at once; a newer push waits for the one in flight.
    concurrency:
      group: frontend-deploy-production
      cancel-in-progress: false
    env:
      # Repository variable (Settings > Secrets and variables > Actions >
      # Variables). It is compiled into public JavaScript, so it is a
      # variable, not a secret. Example: https://payroll.example.com
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      # These pre-fill the login form (LoginPage.jsx). They must never be
      # baked into a production bundle, whatever a developer's local
      # frontend/.env holds.
      VITE_DEFAULT_EMAIL: ''
      VITE_DEFAULT_PASSWORD: ''
      # Optional repository variable; defaults to the docroot in
      # deploy/nginx/zoiko-payroll.conf.
      FRONTEND_DIST_PATH: ${{ vars.FRONTEND_DIST_PATH || '/var/www/zoiko-payroll/frontend/dist' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require the production API base URL
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Repository variable VITE_API_BASE_URL is not set. Without it the bundle calls <host>:8000, which production does not expose, so the deploy is refused rather than shipping a broken site."
            exit 1
          fi
          echo "API base URL: $VITE_API_BASE_URL"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend for production
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify the bundle
        working-directory: frontend
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          grep -rqF "$VITE_API_BASE_URL" dist/assets || { echo "::error::VITE_API_BASE_URL was not compiled into the bundle"; exit 1; }
          tar -czf ../frontend-dist.tgz -C dist .
          ls -l ../frontend-dist.tgz

      - name: Upload build to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: frontend-dist.tgz
          target: zoiko-frontend-release/${{ github.sha }}

      - name: Swap in the new build (keeps the previous one for rollback)
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          envs: RELEASE_SHA,FRONTEND_DIST_PATH
          script: |
            set -euo pipefail
            RELEASE="$HOME/zoiko-frontend-release/$RELEASE_SHA"
            mkdir -p "$RELEASE/dist"
            tar -xzf "$RELEASE/frontend-dist.tgz" -C "$RELEASE/dist"
            test -f "$RELEASE/dist/index.html"

            echo "--- deploying $RELEASE_SHA to $FRONTEND_DIST_PATH"
            sudo mkdir -p "$FRONTEND_DIST_PATH"
            # Rollback copy of what is live right now:
            #   sudo rsync -a --delete "${FRONTEND_DIST_PATH}.previous/" "$FRONTEND_DIST_PATH/"
            sudo rsync -a --delete "$FRONTEND_DIST_PATH/" "${FRONTEND_DIST_PATH}.previous/"
            sudo rsync -a --delete "$RELEASE/dist/" "$FRONTEND_DIST_PATH/"

            cmp "$RELEASE/dist/index.html" "$FRONTEND_DIST_PATH/index.html"
            echo "--- live index.html now references:"
            grep -o 'assets/index-[A-Za-z0-9_-]*\.js' "$FRONTEND_DIST_PATH/index.html" || true

            # Keep the last 5 uploaded releases on disk.
            ls -1dt "$HOME"/zoiko-frontend-release/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf
