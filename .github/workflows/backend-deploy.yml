name: Deploy Zoiko Payroll Backend

# The ONE deploy pipeline: production (backend AND frontend) is deployed only
# after the frontend build, the backend tests and the privacy-isolation job
# have all passed for the same commit. Before, the frontend deployed from its
# own workflow after its build alone, while the backend tests were still running.
on:
  # No path filter on push: every push to main/rugvedh runs build + test +
  # privacy-isolation. The `changes` job decides which side is deployed, so a
  # frontend-only change still never restarts the backend (and vice versa).
  push:
    branches: [main, rugvedh]
  # No path filter on PRs: the test + privacy jobs must report on every PR
  # (a frontend-only PR otherwise shows no backend checks at all). The
  # deploy jobs are push/dispatch-only, so this never deploys from a PR.
  pull_request:
    branches: [main, rugvedh]
  workflow_dispatch:

jobs:
  # Which side this push changed (same paths the two workflows used to filter
  # on). A manual dispatch deploys both.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed paths
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          both() { echo "Changed paths unknown ($1): treating backend AND frontend as changed."
                   echo "backend=true" >> "$GITHUB_OUTPUT"; echo "frontend=true" >> "$GITHUB_OUTPUT"; exit 0; }
          # Fail safe: whenever the diff cannot be determined, both sides count as changed.
          [ "${{ github.event_name }}" = "push" ] || both "not a push"
          [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] || both "new branch / no previous commit"
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || both "previous commit $BEFORE not in history (force push?)"
          files="$(git diff --name-only "$BEFORE" "${{ github.sha }}" 2>/dev/null)" || both "git diff failed"
          echo "$files"
          if echo "$files" | grep -qE '^(backend/|\.github/workflows/|scripts/|docs/privacy/)'; then b=true; else b=false; fi
          if echo "$files" | grep -qE '^(frontend/|\.github/workflows/(frontend-build|backend-deploy)\.yml$)'; then f=true; else f=false; fi
          echo "backend=$b" >> "$GITHUB_OUTPUT"; echo "frontend=$f" >> "$GITHUB_OUTPUT"

  # The frontend build, here so the deploys can wait for it. Same steps as
  # frontend-build.yml's build (which still reports the PR check).
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Refuse undefined names (no-undef / jsx-no-undef)
        working-directory: frontend
        run: npm run check:undefined
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # Runs on every PR and every push to main/rugvedh. Nothing previously ran the
  # test suite in CI at all -- a broken test could reach main and deploy
  # unchecked. Needs zero configured secrets: tests/conftest.py's `db`
  # fixture is an isolated in-memory SQLite database per test, and
  # app/config.py's fail-closed guards only fire outside a "development"
  # environment, which a bare CI runner satisfies because tests/conftest.py
  # sets DEBUG=true for the suite (config.py's own default is false).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.12 (matches the production image)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Set up Python and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run backend test suite
        working-directory: backend
        run: python -m pytest -q

  privacy-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: zp_privacy
          POSTGRES_PASSWORD: zp_privacy
          POSTGRES_DB: zp_privacy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zp_privacy -d zp_privacy_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      ZP_REQUIRE_POSTGRES_TESTS: "1"
      ZP_TEST_POSTGRES_URL: postgresql+psycopg://zp_privacy:zp_privacy@localhost:5432/zp_privacy_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Route registry check
        run: python -m pytest -q tests/privacy/test_route_registry.py
        working-directory: backend
      - name: Full privacy suite
        run: pytest -q -p no:cacheprovider tests/privacy
        working-directory: backend
      - name: Privacy scan of test data
        run: python -m scripts.scan_test_data
        working-directory: backend
      - name: Privacy defect checks
        run: python -m scripts.check_privacy_defects
        working-directory: backend
      # Belgium (ZP-BE-ENG-001 Block D1): each Belgian migration's upgrade / downgrade
      # round trip with row-level security on this PostgreSQL. Last step: the round
      # trip drops and recreates the disposable schema.
      - name: Belgium migrations on PostgreSQL (RLS round trip)
        run: python -m pytest -q -p no:cacheprovider tests/test_belgium_migrations.py tests/test_belgium_block_b_migration.py tests/test_belgium_block_c_migration.py tests/test_belgium_seed_postgres.py
        working-directory: backend
      # Belgium (ZP-BE-ENG-001 Block L1): the rollback guarantee. Rollback = dormancy + fix-forward
      # (the Belgian schema is permanent). With the full schema and Belgium switched off: every
      # Belgian route 404s, the calculation is blocked, the Super Admin console writes nothing,
      # other countries are unaffected and the app starts with no Belgian setting.
      - name: Belgium rollback proof (dormancy)
        run: python -m pytest -q -p no:cacheprovider tests/test_belgium_dormancy_proof.py
        working-directory: backend

  deploy:
    needs: [changes, build, test, privacy-isolation]
    if: github.event_name == 'push' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      HAS_SMOKE: ${{ secrets.ZP_SMOKE_BASE_URL != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.12 (matches the production image)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Set up Python and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Verify single Alembic head, no duplicate revision IDs
        run: |
          python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; import sys; cfg = Config('backend/alembic.ini'); script = ScriptDirectory.from_config(cfg); heads = script.get_heads();
          if len(heads) != 1:
              print(f'FAIL: expected exactly one alembic head, found {len(heads)}: {heads}'); sys.exit(1)
          print(f'OK: single head {heads[0]}')"
      - name: SSH and deploy backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /var/www/zoiko-payroll/backend
            TARGET_BRANCH="${GITHUB_REF_NAME:-main}"
            git fetch origin "$TARGET_BRANCH"
            git checkout "$TARGET_BRANCH" || git checkout -b "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
            git pull origin "$TARGET_BRANCH"
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt

            echo "--- Migration diagnostics (read-only) ---"
            git rev-parse HEAD
            alembic heads || true
            alembic branches || true
            alembic history | head -n 40 || true
            alembic current || true
            echo "Database alembic_version:"
            python -c "import textwrap, sys; exec(textwrap.dedent(sys.stdin.read()))" <<'PY' || true
            from sqlalchemy import text
            from app.database import engine

            with engine.connect() as conn:
                rows = conn.execute(text("SELECT version_num FROM alembic_version")).fetchall()
            for row in rows:
                print("  " + row[0])
            PY

            echo "--- Applying migrations (self-healing orphan revisions) ---"
            bash ../scripts/deploy_migrate.sh

            echo "--- Post-migration verification ---"
            echo "Repository heads:"
            alembic heads

            echo "Database revisions:"
            alembic current

            # Alembic exits nonzero if the database is not at every head.
            alembic current --check-heads

            python -c "import textwrap, sys; exec(textwrap.dedent(sys.stdin.read()))" <<'PY'
            from alembic.config import Config
            from alembic.runtime.migration import MigrationContext
            from alembic.script import ScriptDirectory
            from app.database import engine

            config = Config("alembic.ini")
            script = ScriptDirectory.from_config(config)

            expected = set(script.get_heads())
            with engine.connect() as connection:
                actual = set(MigrationContext.configure(connection).get_current_heads())

            print(f"expected heads: {sorted(expected)}")
            print(f"database heads: {sorted(actual)}")

            if actual != expected:
                raise SystemExit(
                    "Database is not at the Alembic head: "
                    f"missing={sorted(expected - actual)}, "
                    f"unexpected={sorted(actual - expected)}"
                )
            print("Database is at the Alembic head.")
            PY

            deactivate
            sudo systemctl restart zoiko-payroll-backend
      - name: Post-deploy privacy smoke
        # Runs once the production smoke identities are configured (HP-10).
        if: ${{ env.HAS_SMOKE == 'true' }}
        env:
          ZP_SMOKE_BASE_URL: ${{ secrets.ZP_SMOKE_BASE_URL }}
          ZP_SMOKE_IDENTITIES: ${{ secrets.ZP_SMOKE_IDENTITIES }}
          ZP_SMOKE_EMPLOYEE_ID: ${{ secrets.ZP_SMOKE_EMPLOYEE_ID }}
          ZP_SMOKE_ALERT_WEBHOOK: ${{ secrets.ZP_SMOKE_ALERT_WEBHOOK }}
          ZP_SMOKE_RUN_ID: privacy-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python -m pip install pyotp
          python backend/scripts/post_deploy_privacy_smoke.py --output privacy_smoke_result.json
      - name: Record privacy smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-smoke-${{ github.run_id }}
          path: privacy_smoke_result.json
          if-no-files-found: warn
      - name: Check for model/schema drift
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd /var/www/zoiko-payroll/backend/backend
            source venv/bin/activate
            python -m scripts.check_schema_drift

  # The frontend deploy (moved from frontend-build.yml): waits for the build, the backend
  # tests and privacy-isolation of the same commit. main only, as before.
  # Order: when the backend is also deployed, the frontend goes only after the
  # backend deploy SUCCEEDED (a new frontend may call new backend endpoints).
  # `!cancelled()` lets this job evaluate when `deploy` was skipped (no backend
  # change, or a manual run); every other dependency must be an explicit success.
  deploy-frontend:
    needs: [changes, build, test, privacy-isolation, deploy]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success' && needs.build.result == 'success'
      && needs.test.result == 'success' && needs.privacy-isolation.result == 'success'
      && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
      && ((github.event_name == 'push' && needs.changes.outputs.frontend == 'true') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Never two frontend deploys at once; a newer push waits for the one in flight.
    concurrency:
      group: frontend-deploy-production
      cancel-in-progress: false
    env:
      # Repository variable (Settings > Secrets and variables > Actions >
      # Variables). It is compiled into public JavaScript, so it is a
      # variable, not a secret. Example: https://payroll.example.com
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      # These pre-fill the login form (LoginPage.jsx). They must never be
      # baked into a production bundle, whatever a developer's local
      # frontend/.env holds.
      VITE_DEFAULT_EMAIL: ''
      VITE_DEFAULT_PASSWORD: ''
      # Optional repository variable; defaults to the docroot in
      # deploy/nginx/zoiko-payroll.conf.
      FRONTEND_DIST_PATH: ${{ vars.FRONTEND_DIST_PATH || '/var/www/zoiko-payroll/frontend/dist' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require the production API base URL
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Repository variable VITE_API_BASE_URL is not set. Without it the bundle calls <host>:8000, which production does not expose, so the deploy is refused rather than shipping a broken site."
            exit 1
          fi
          echo "API base URL: $VITE_API_BASE_URL"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend for production
        working-directory: frontend
        run: |
          npm ci
          npm run check:undefined
          npm run build

      - name: Verify the bundle
        working-directory: frontend
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          grep -rqF "$VITE_API_BASE_URL" dist/assets || { echo "::error::VITE_API_BASE_URL was not compiled into the bundle"; exit 1; }
          tar -czf ../frontend-dist.tgz -C dist .
          ls -l ../frontend-dist.tgz

      - name: Upload build to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: frontend-dist.tgz
          target: zoiko-frontend-release/${{ github.sha }}

      - name: Swap in the new build (keeps the previous one for rollback)
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          envs: RELEASE_SHA,FRONTEND_DIST_PATH
          script: |
            set -euo pipefail
            RELEASE="$HOME/zoiko-frontend-release/$RELEASE_SHA"
            mkdir -p "$RELEASE/dist"
            tar -xzf "$RELEASE/frontend-dist.tgz" -C "$RELEASE/dist"
            test -f "$RELEASE/dist/index.html"

            echo "--- deploying $RELEASE_SHA to $FRONTEND_DIST_PATH"
            sudo mkdir -p "$FRONTEND_DIST_PATH"
            # Rollback copy of what is live right now:
            #   sudo rsync -a --delete "${FRONTEND_DIST_PATH}.previous/" "$FRONTEND_DIST_PATH/"
            sudo rsync -a --delete "$FRONTEND_DIST_PATH/" "${FRONTEND_DIST_PATH}.previous/"
            sudo rsync -a --delete "$RELEASE/dist/" "$FRONTEND_DIST_PATH/"

            cmp "$RELEASE/dist/index.html" "$FRONTEND_DIST_PATH/index.html"
            echo "--- live index.html now references:"
            grep -o 'assets/index-[A-Za-z0-9_-]*\.js' "$FRONTEND_DIST_PATH/index.html" || true

            # Keep the last 5 uploaded releases on disk.
            ls -1dt "$HOME"/zoiko-frontend-release/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf
