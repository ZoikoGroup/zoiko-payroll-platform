name: Deploy Zoiko Payroll Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Verify single Alembic head, no duplicate revision IDs
        run: |
          python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; import sys; cfg = Config('backend/alembic.ini'); script = ScriptDirectory.from_config(cfg); heads = script.get_heads();
          if len(heads) != 1:
              print(f'FAIL: expected exactly one alembic head, found {len(heads)}: {heads}'); sys.exit(1)
          print(f'OK: single head {heads[0]}')"
      - name: SSH and deploy backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /var/www/zoiko-payroll/backend
            git pull origin main
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt

            echo "--- Migration diagnostics (read-only) ---"
            git rev-parse HEAD
            alembic heads
            alembic branches
            alembic history | head -n 40 || true
            alembic current

            echo "--- Applying migrations (self-healing orphan revisions) ---"
            bash ../scripts/deploy_migrate.sh

            echo "--- Post-migration verification ---"
            python - <<'PY'
            from alembic.config import Config
            from alembic.script import ScriptDirectory
            from alembic.runtime.migration import MigrationContext
            from app.database import engine

            config = Config("alembic.ini")
            script = ScriptDirectory.from_config(config)

            expected_heads = set(script.get_heads())

            with engine.connect() as connection:
                actual_heads = set(
                    MigrationContext.configure(connection).get_current_heads()
                )

            print(f"database revisions: {sorted(actual_heads)}")
            print(f"migration heads:    {sorted(expected_heads)}")

            if actual_heads != expected_heads:
                missing = expected_heads - actual_heads
                unexpected = actual_heads - expected_heads
                raise SystemExit(
                    "FATAL: database is not at the Alembic head "
                    f"(missing={sorted(missing)}, unexpected={sorted(unexpected)})"
                )

            print("Final revision matches Alembic head.")
            PY

            deactivate
            sudo systemctl restart zoiko-payroll-backend
      - name: Check for model/schema drift
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd /var/www/zoiko-payroll/backend/backend
            source venv/bin/activate
            python -m scripts.check_schema_drift
