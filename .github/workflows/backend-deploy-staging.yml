# DRAFT / PROPOSAL — not yet active.
#
# This workflow is a parameterized copy of backend-deploy.yml, targeting a
# second, isolated environment instead of production. It is safe to merge
# as-is: it only runs on a push to a `staging` branch (which doesn't exist
# yet) or a manual dispatch, and every step depends on secrets
# (STAGING_SSH_HOST/USER/KEY) that are not configured — so until both the
# branch and the secrets exist, this workflow simply never fires.
#
# See docs/STAGING_ENVIRONMENT_PROPOSAL.md for what would need provisioning
# in GCP before this can actually run, and the rough cost/effort shape.
# This is a proposal for review, not something already provisioned or
# executed.
name: Deploy Zoiko Payroll Backend (Staging)

on:
  push:
    branches: [staging]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'docs/privacy/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run backend test suite
        working-directory: backend
        run: python -m pytest -q

  # ZP-PRIV E06: tenant-isolation gate. Runs the route-registry test and the
  # whole tests/privacy suite (T01-T12) on SQLite AND on a real Postgres with
  # RLS installed, bans unscoped worker queries (tests/privacy/test_data_layer.py
  # ratchet), scans fixtures/dumps for real-looking identifiers, and fails on
  # an open critical privacy defect. Deploy needs it. Changes to the privacy
  # paths in .github/CODEOWNERS invalidate any prior attestation.
  privacy-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zp_owner
          POSTGRES_PASSWORD: zp_ci_only_pw
          POSTGRES_DB: zp_priv
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zp_owner -d zp_priv"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ZP_TEST_POSTGRES_URL: postgresql+psycopg2://zp_owner:zp_ci_only_pw@localhost:5433/zp_priv
      ZP_REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Route policy registry is complete and current
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider tests/privacy/test_route_registry.py
      - name: Privacy isolation suite (SQLite + Postgres RLS)
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider tests/privacy
      - name: No real-looking identifiers in fixtures, dumps or scripts
        working-directory: backend
        run: python -m scripts.scan_test_data
      - name: No open critical privacy defect or P0 exception
        working-directory: backend
        run: python -m scripts.check_privacy_defects
      - name: Attestation record (never VERIFIED without a named reviewer)
        # A report, not a gate: BLOCKED / NOT VERIFIED is recorded in the
        # artifact; tests, scan and the defect register above are the gate.
        continue-on-error: true
        working-directory: backend
        run: python -m scripts.run_privacy_attestation --skip-tests --build-number "${{ github.run_number }}"
      - name: Upload privacy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-evidence-${{ github.run_number }}
          path: |
            backend/tests/privacy/evidence/
            docs/privacy/evidence_pack/

  deploy:
    needs: [test, privacy-isolation]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Verify single Alembic head, no duplicate revision IDs
        run: |
          python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; import sys; cfg = Config('backend/alembic.ini'); script = ScriptDirectory.from_config(cfg); heads = script.get_heads();
          if len(heads) != 1:
              print(f'FAIL: expected exactly one alembic head, found {len(heads)}: {heads}'); sys.exit(1)
          print(f'OK: single head {heads[0]}')"
      # Separate secrets from production's GCP_SSH_HOST/USER/KEY -- a
      # staging deploy must never be able to reach the production host,
      # so these are deliberately distinct secret names, not a shared one
      # with a different value swapped in per-environment.
      - name: SSH and deploy backend (staging)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /var/www/zoiko-payroll-staging/backend
            git pull origin staging
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt
            bash ../scripts/deploy_migrate.sh
            deactivate
            sudo systemctl restart zoiko-payroll-backend-staging
      - name: Post-deploy privacy smoke
        env:
          ZP_SMOKE_BASE_URL: ${{ secrets.STAGING_ZP_SMOKE_BASE_URL }}
          ZP_SMOKE_IDENTITIES: ${{ secrets.STAGING_ZP_SMOKE_IDENTITIES }}
          ZP_SMOKE_EMPLOYEE_ID: ${{ secrets.STAGING_ZP_SMOKE_EMPLOYEE_ID }}
          ZP_SMOKE_ALERT_WEBHOOK: ${{ secrets.STAGING_ZP_SMOKE_ALERT_WEBHOOK }}
          ZP_SMOKE_RUN_ID: privacy-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python -m pip install pyotp
          python backend/scripts/post_deploy_privacy_smoke.py --output privacy_smoke_result.json
      - name: Record privacy smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-smoke-${{ github.run_id }}
          path: privacy_smoke_result.json
          if-no-files-found: warn
      - name: Check for model/schema drift
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /var/www/zoiko-payroll-staging/backend/backend
            source venv/bin/activate
            python -m scripts.check_schema_drift
