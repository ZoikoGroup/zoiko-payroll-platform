deviations:
  - id: DEV-1
    controls: [B05]
    text: legal_entity_id / pay_group_id live on payroll_employees only; worker child tables are scoped through employee_id (scoped-employee subquery), not a denormalised column.
  - id: DEV-2
    controls: [B05]
    text: The "no raw db.query(PayrollEmployee)" lint is a ratchet (121 legacy call sites, may only go down). The ORM guard scopes TENANT sessions and refuses PLATFORM sessions on worker tables; a session with NO context (jobs, schedulers, audit writers, public token routes) is unrestricted system context and maps to RLS mode "system". Background jobs that act for a user bind tenant context through core/job_auth.py; the rest rely on explicit organization_id filters (PD-007).
  - id: DEV-3
    controls: [B05, D01]
    text: Postgres RLS is installed and tested, but enforcement in production requires ops to run the app as a NOBYPASSRLS, non-owner role; DB_RLS_REQUIRE_ENFORCED defaults to false until that role exists.
  - id: DEV-4
    controls: [A06]
    text: The differencing / query-budget ledger is per process (not shared across workers).
  - id: DEV-5
    controls: [B08]
    text: Refresh-token rotation invalidates all pre-existing refresh tokens at deploy; every user signs in again once.
  - id: DEV-6
    controls: [D05]
    text: Zoiko One does not exist in the repo; the claim contract, gate and tests run against a fake IdP. Integration pending.
  - id: DEV-8
    controls: [B05, E02]
    text: app.rls_mode / app.tenant_id are custom settings any database role can set, so RLS defends against application query bugs, not against code that deliberately switches to system mode (PD-007). The audit purge flag is additionally gated on membership of the zoiko_audit_purger role, which the application role must never hold.
  - id: DEV-9
    controls: [D06, F02]
    text: Outbound webhook delivery is built and signed but not yet dispatched by any job; data_region has no admin API (every tenant is EU) and only support access / break-glass call the region check (PD-009, PD-010).
  - id: DEV-7
    controls: [D03]
    text: Payslip PDFs are still emailed as unencrypted attachments (indirect-path gap G7, owner Product).

