# ZP-PRIV-VERIFY-001 control register
#
# 46 controls: 41 P0 + 5 P1 (A06, D09, E07, F03, F07).
#
# Status vocabulary (engineering may only ever write these three):
#   NT                                    not tested / proof lives outside the repo
#   ENGINEERING_COMPLETE_AWAITING_REVIEW  built + automated tests green; not yet reviewed
#   FAIL                                  a known failing control
# There is deliberately no PASS. A control becomes "reviewed" only through a
# recorded independent review (Privacy Assurance page -> "Record review",
# platform_security + step-up MFA, or a `reviews:` entry below naming the
# reviewer and proof). scripts/run_privacy_attestation.py can never print
# VERIFIED unless every control carries an accepted review by a named human and
# `attestation.independent_reviewer` is filled in.
#
# Any change under the CODEOWNERS privacy paths invalidates the prior
# attestation (F07): the attestation stamps the git SHA it ran on.

