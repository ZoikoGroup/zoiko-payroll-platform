# ==============================================================================
# Zoiko Payroll Platform - Celery Worker Deployment Configuration
# ==============================================================================
# Production Supervisor / Systemd configuration for distributed worker pools.
# Architecture adheres to queue isolation: CPU-bound calculations run isolated
# from I/O-bound uploads and notification bursts.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. SUPERVISORD CONFIGURATION (/etc/supervisor/conf.d/zoiko_celery.conf)
# ------------------------------------------------------------------------------
[group:zoiko_workers]
programs=celery_payroll,celery_attendance,celery_reports,celery_default,celery_beat

# Worker pool 1: Dedicated CPU Calculation Worker (Payslip Chord Header & Finalizer)
[program:celery_payroll]
directory=/var/www/zoiko-payroll/backend
command=/var/www/zoiko-payroll/backend/venv/bin/celery -A app.core.celery_app worker -Q payroll -c 4 --prefetch-multiplier=1 --max-tasks-per-child=1000 --loglevel=INFO -n payroll_worker@%%h
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
stdout_logfile=/var/log/celery/payroll_worker.log
stderr_logfile=/var/log/celery/payroll_worker_err.log
environment=PYTHONPATH="/var/www/zoiko-payroll/backend"

# Worker pool 2: Streaming Attendance Ingestion Worker (Phase 2.3 I/O Worker)
[program:celery_attendance]
directory=/var/www/zoiko-payroll/backend
command=/var/www/zoiko-payroll/backend/venv/bin/celery -A app.core.celery_app worker -Q attendance -c 2 --prefetch-multiplier=4 --max-tasks-per-child=500 --loglevel=INFO -n attendance_worker@%%h
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
stdout_logfile=/var/log/celery/attendance_worker.log
stderr_logfile=/var/log/celery/attendance_worker_err.log
environment=PYTHONPATH="/var/www/zoiko-payroll/backend"

# Worker pool 3: Reporting & Exports Worker
[program:celery_reports]
directory=/var/www/zoiko-payroll/backend
command=/var/www/zoiko-payroll/backend/venv/bin/celery -A app.core.celery_app worker -Q reports -c 2 --prefetch-multiplier=2 --max-tasks-per-child=500 --loglevel=INFO -n reports_worker@%%h
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
stdout_logfile=/var/log/celery/reports_worker.log
stderr_logfile=/var/log/celery/reports_worker_err.log
environment=PYTHONPATH="/var/www/zoiko-payroll/backend"

# Worker pool 4: General & Maintenance Worker (Emails, Billing, Fallback)
[program:celery_default]
directory=/var/www/zoiko-payroll/backend
command=/var/www/zoiko-payroll/backend/venv/bin/celery -A app.core.celery_app worker -Q emails,billing,maintenance,assist,default -c 2 --prefetch-multiplier=4 --max-tasks-per-child=1000 --loglevel=INFO -n default_worker@%%h
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
stdout_logfile=/var/log/celery/default_worker.log
stderr_logfile=/var/log/celery/default_worker_err.log
environment=PYTHONPATH="/var/www/zoiko-payroll/backend"

# Celery Beat Scheduler (Periodic cleanup & trials)
[program:celery_beat]
directory=/var/www/zoiko-payroll/backend
command=/var/www/zoiko-payroll/backend/venv/bin/celery -A app.core.celery_app beat --loglevel=INFO --schedule=/var/run/celery/celerybeat-schedule
autostart=true
autorestart=true
user=www-data
numprocs=1
stdout_logfile=/var/log/celery/beat.log
stderr_logfile=/var/log/celery/beat_err.log
environment=PYTHONPATH="/var/www/zoiko-payroll/backend"
